<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke-like Battle Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Poke-like Battle Simulator</h1>
    
    <div class="control-panel">
        <button class="btn btn-reset" onclick="resetBattle()">バトルをリセット（HP全回復）</button>
    </div>

    <div class="battlefield">
        <!-- プレイヤー 1 -->
        <div class="player-card" id="p1-card">
            <h2>プレイヤー 1</h2>
            
            <div class="status-group">
                <div class="status-input">
                    <label for="p1-max-hp">最大HP (～180):</label>
                    <input type="number" id="p1-max-hp" value="150" min="1" max="180" onchange="resetBattle()">
                </div>
                <div class="status-input">
                    <label for="p1-attack">こうげき (～180):</label>
                    <input type="number" id="p1-attack" value="100" min="1" max="180">
                </div>
                <div class="status-input">
                    <label for="p1-defense">ぼうぎょ (～180):</label>
                    <input type="number" id="p1-defense" value="100" min="1" max="180">
                </div>
            </div>

            <div class="hp-section">
                <div class="hp-bar-container">
                    <div id="p1-hp-bar" class="hp-bar"></div>
                </div>
                <div id="p1-hp-text" class="hp-text">150 / 150</div>
            </div>

            <div class="move-list">
                <h3>技リスト</h3>
                <div class="move-item">
                    <!-- list属性と、選択時に威力を同期するoninputを設定 -->
                    <input type="text" id="p1-move-name-0" list="move-database" oninput="syncMovePower('p1', 0)" value="たいあたり">
                    <input type="number" id="p1-move-power-0" value="60" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p1', 0)">使用</button>
                </div>
                <div class="move-item">
                    <input type="text" id="p1-move-name-1" list="move-database" oninput="syncMovePower('p1', 1)" value="かえんほうしゃ">
                    <input type="number" id="p1-move-power-1" value="90" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p1', 1)">使用</button>
                </div>
                <div class="move-item">
                    <input type="text" id="p1-move-name-2" list="move-database" oninput="syncMovePower('p1', 2)" value="ウルトラバースト">
                    <input type="number" id="p1-move-power-2" value="120" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p1', 2)">使用</button>
                </div>
            </div>
        </div>

        <!-- プレイヤー 2 -->
        <div class="player-card" id="p2-card">
            <h2>プレイヤー 2</h2>
            
            <div class="status-group">
                <div class="status-input">
                    <label for="p2-max-hp">最大HP (～180):</label>
                    <input type="number" id="p2-max-hp" value="150" min="1" max="180" onchange="resetBattle()">
                </div>
                <div class="status-input">
                    <label for="p2-attack">こうげき (～180):</label>
                    <input type="number" id="p2-attack" value="100" min="1" max="180">
                </div>
                <div class="status-input">
                    <label for="p2-defense">ぼうぎょ (～180):</label>
                    <input type="number" id="p2-defense" value="100" min="1" max="180">
                </div>
            </div>

            <div class="hp-section">
                <div class="hp-bar-container">
                    <div id="p2-hp-bar" class="hp-bar"></div>
                </div>
                <div id="p2-hp-text" class="hp-text">150 / 150</div>
            </div>

            <div class="move-list">
                <h3>技リスト</h3>
                <div class="move-item">
                    <input type="text" id="p2-move-name-0" list="move-database" oninput="syncMovePower('p2', 0)" value="たいあたり">
                    <input type="number" id="p2-move-power-0" value="60" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p2', 0)">使用</button>
                </div>
                <div class="move-item">
                    <input type="text" id="p2-move-name-1" list="move-database" oninput="syncMovePower('p2', 1)" value="ハイドロポンプ">
                    <input type="number" id="p2-move-power-1" value="90" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p2', 1)">使用</button>
                </div>
                <div class="move-item">
                    <input type="text" id="p2-move-name-2" list="move-database" oninput="syncMovePower('p2', 2)" value="ギガインパクト">
                    <input type="number" id="p2-move-power-2" value="120" min="0" max="120" title="威力">
                    <button class="btn-use-move" onclick="useMove('p2', 2)">使用</button>
                </div>
            </div>
        </div>
    </div>

    <!-- バトルログ -->
    <h2>バトルログ</h2>
    <div id="log-container" class="log-container">
        <div class="log-entry">バトル開始！ステータスを入力して技を選択してください。</div>
    </div>
</div>

<!-- 技のデータベースの選択候補が入るdatalistタグ（中身はJSで自動生成します） -->
<datalist id="move-database"></datalist>

<script src="script.js"></script>
</body>
</html>
