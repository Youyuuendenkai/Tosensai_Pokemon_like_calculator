<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poke-like Battle Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Poke-like Battle Simulator</h1>
    
    <div class="control-panel">
        <button class="btn btn-reset" onclick="resetBattle()">バトルをリセット<br><small>（HP全回復）</small></button>
        <button class="btn btn-undo" id="btn-undo" onclick="undo()" disabled>１つ前の状態に戻る<br><small>（やり直し）</small></button>
    </div>

    <div class="battlefield">
        <!-- プレイヤー 1 -->
        <div class="player-card" id="p1-card">
            <h2>プレイヤー 1</h2>
            
            <div class="status-group">
                <!-- HP設定ステッパー（readonlyを削除し、手入力も可能に） -->
                <div class="status-input-row">
                    <label>最大HP (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p1-max-hp', -10, 10, 180)">－</button>
                        <input type="number" id="p1-max-hp" value="150" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p1-max-hp', 10, 10, 180)">＋</button>
                    </div>
                </div>
                <!-- 攻撃設定ステッパー -->
                <div class="status-input-row">
                    <label>こうげき (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p1-attack', -10, 10, 180)">－</button>
                        <input type="number" id="p1-attack" value="100" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p1-attack', 10, 10, 180)">＋</button>
                    </div>
                </div>
                <!-- 防御設定ステッパー -->
                <div class="status-input-row">
                    <label>ぼうぎょ (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p1-defense', -10, 10, 180)">－</button>
                        <input type="number" id="p1-defense" value="100" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p1-defense', 10, 10, 180)">＋</button>
                    </div>
                </div>
            </div>

            <div class="hp-section">
                <div class="hp-bar-container">
                    <div id="p1-hp-bar" class="hp-bar"></div>
                </div>
                <div id="p1-hp-text" class="hp-text">150 / 150</div>
            </div>

            <div class="move-list">
                <h3>技リスト（選択して使用）</h3>
                
                <!-- 技スロット 1 -->
                <div class="move-item">
                    <select id="p1-move-name-0" onchange="onSelectMove('p1', 0)"></select>
                    <!-- 威力は表示だけに。裏側で計算用にhidden inputを持ちます -->
                    <span class="move-power-label">威力: <span id="p1-move-power-display-0">60</span></span>
                    <input type="hidden" id="p1-move-power-0" value="60">
                    <button class="btn-use-move" onclick="useMove('p1', 0)">使用</button>
                </div>
                <!-- 技スロット 2 -->
                <div class="move-item">
                    <select id="p1-move-name-1" onchange="onSelectMove('p1', 1)"></select>
                    <span class="move-power-label">威力: <span id="p1-move-power-display-1">90</span></span>
                    <input type="hidden" id="p1-move-power-1" value="90">
                    <button class="btn-use-move" onclick="useMove('p1', 1)">使用</button>
                </div>
                <!-- 技スロット 3 -->
                <div class="move-item">
                    <select id="p1-move-name-2" onchange="onSelectMove('p1', 2)"></select>
                    <span class="move-power-label">威力: <span id="p1-move-power-display-2">120</span></span>
                    <input type="hidden" id="p1-move-power-2" value="120">
                    <button class="btn-use-move" onclick="useMove('p1', 2)">使用</button>
                </div>
            </div>
        </div>

        <!-- プレイヤー 2 -->
        <div class="player-card" id="p2-card">
            <h2>プレイヤー 2</h2>
            
            <div class="status-group">
                <!-- HP設定ステッパー -->
                <div class="status-input-row">
                    <label>最大HP (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p2-max-hp', -10, 10, 180)">－</button>
                        <input type="number" id="p2-max-hp" value="150" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p2-max-hp', 10, 10, 180)">＋</button>
                    </div>
                </div>
                <!-- 攻撃設定ステッパー -->
                <div class="status-input-row">
                    <label>こうげき (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p2-attack', -10, 10, 180)">－</button>
                        <input type="number" id="p2-attack" value="100" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p2-attack', 10, 10, 180)">＋</button>
                    </div>
                </div>
                <!-- 防御設定ステッパー -->
                <div class="status-input-row">
                    <label>ぼうぎょ (～180):</label>
                    <div class="stepper">
                        <button type="button" class="btn-step" onclick="stepValue('p2-defense', -10, 10, 180)">－</button>
                        <input type="number" id="p2-defense" value="100" min="10" max="180">
                        <button type="button" class="btn-step" onclick="stepValue('p2-defense', 10, 10, 180)">＋</button>
                    </div>
                </div>
            </div>

            <div class="hp-section">
                <div class="hp-bar-container">
                    <div id="p2-hp-bar" class="hp-bar"></div>
                </div>
                <div id="p2-hp-text" class="hp-text">150 / 150</div>
            </div>

            <div class="move-list">
                <h3>技リスト（選択して使用）</h3>
                
                <!-- 技スロット 1 -->
                <div class="move-item">
                    <select id="p2-move-name-0" onchange="onSelectMove('p2', 0)"></select>
                    <span class="move-power-label">威力: <span id="p2-move-power-display-0">60</span></span>
                    <input type="hidden" id="p2-move-power-0" value="60">
                    <button class="btn-use-move" onclick="useMove('p2', 0)">使用</button>
                </div>
                <!-- 技スロット 2 -->
                <div class="move-item">
                    <select id="p2-move-name-1" onchange="onSelectMove('p2', 1)"></select>
                    <span class="move-power-label">威力: <span id="p2-move-power-display-1">90</span></span>
                    <input type="hidden" id="p2-move-power-1" value="90">
                    <button class="btn-use-move" onclick="useMove('p2', 1)">使用</button>
                </div>
                <!-- 技スロット 3 -->
                <div class="move-item">
                    <select id="p2-move-name-2" onchange="onSelectMove('p2', 2)"></select>
                    <span class="move-power-label">威力: <span id="p2-move-power-display-2">120</span></span>
                    <input type="hidden" id="p2-move-power-2" value="120">
                    <button class="btn-use-move" onclick="useMove('p2', 2)">使用</button>
                </div>
            </div>
        </div>
    </div>

    <!-- バトルログ -->
    <h2>バトルログ</h2>
    <div id="log-container" class="log-container">
        <div class="log-entry">バトル開始！ステータスを入力して技を選択してください。</div>
    </div>

</div>
    
    <!-- ＝★新規追加：大迫力のHPダメージ演出用ポップアップ -->
    <div id="battle-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-player-name">プレイヤー2</h2>
            <div class="modal-hp-section">
                <div class="modal-hp-bar-container">
                    <div id="modal-hp-bar" class="modal-hp-bar"></div>
                </div>
                <div id="modal-hp-text" class="modal-hp-text">150 / 150</div>
            </div>
            <p id="modal-hint">ダメージをうけている...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
